<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ألعاب جماعية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a loud Cairo arcade front door
   IDEA a painted shop sign in truck-art, each game its own illustrated panel
   PICTURE two big game posters: a tuk-tuk at sunset, a street-war skyline
   COLOUR night maroon #22090f, saffron #ffb703, red #e63946, turquoise #22c3b5
   TYPE Lalezar display + Cairo text
   LAYOUT title and profile on top, two posters side by side (stacked on phones), who's online below */
:root{--bg:#22090f;--ink:#fff6e6;--sf:#ffb703;--red:#e63946;--tq:#22c3b5;--card:#2e0f17}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Cairo,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(1200px 600px at 50% -10%,#5a1622 0%,transparent 60%),var(--bg)}
.truck{height:12px;background:repeating-linear-gradient(90deg,var(--red) 0 22px,var(--sf) 22px 44px,var(--tq) 44px 66px,#1f7a3a 66px 88px)}
.wrap{max-width:1100px;margin:0 auto;padding:20px max(5vw,16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(5vw,16px,env(safe-area-inset-left,0px))}
header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;margin-bottom:18px}
h1{font-family:Lalezar,Cairo,sans-serif;font-weight:400;font-size:clamp(48px,9vw,84px);line-height:1;margin:6px 0 0;color:var(--sf);text-shadow:3px 3px 0 var(--red)}
.sub{margin:6px 0 0;font-size:17px;opacity:.9}
.me{background:var(--card);border:1px solid rgba(255,183,3,.3);border-radius:16px;padding:12px 14px;display:grid;gap:8px;min-width:280px}
.me label{font-weight:800;font-size:14px;color:#ffd98a}
.me input{width:100%;font:600 16px Cairo,sans-serif;padding:8px 12px;border-radius:10px;border:2px solid rgba(255,183,3,.5);background:rgba(255,255,255,.08);color:var(--ink)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;outline:2px solid rgba(255,255,255,.25);cursor:pointer}
.sw button[aria-pressed=true]{border-color:#fff;outline-color:var(--sf)}
.apps{display:flex;flex-wrap:wrap;gap:22px 26px;padding:8px 4px}
.app{display:grid;justify-items:center;gap:8px;width:104px;text-decoration:none;color:var(--ink)}
.app b{font-size:15px;font-weight:800;text-align:center;line-height:1.25}
.ico{display:block;width:96px;height:96px;border-radius:24px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.12);transition:transform .12s}
.ico img{width:100%;height:100%;object-fit:cover;display:block}
.ico.tuk{background:radial-gradient(circle at 50% 30%,#ffe4a8,#ff9e57 55%,#c8502e)}
.ico.tuk img{transform:scale(1.18) translateY(4%)}
.ico.war{background:radial-gradient(circle at 60% 30%,#5e6f86,#2a2f3a 65%,#16181d)}
.ico.war img{transform:scale(1.3) rotate(-8deg)}
.app:hover .ico,.app:focus-visible .ico{transform:translateY(-3px) scale(1.04)}
.app:active .ico{transform:scale(.95)}
.app:focus-visible{outline:none}
.online{margin-top:22px;background:var(--card);border-radius:18px;padding:14px 16px}
.online h3{margin:0 0 8px;font-size:17px;color:#ffd98a}
.online ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.online li{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border-radius:999px;padding:4px 12px 4px 8px;font-weight:600}
.online li i{width:12px;height:12px;border-radius:50%}
.online li small{opacity:.75;font-weight:400}
.online .empty{opacity:.75;background:none;padding:0}
footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;font-size:14px;opacity:.85;flex-wrap:wrap}
footer button{background:none;border:0;color:#ffd98a;font:600 15px Cairo,sans-serif;text-decoration:underline;cursor:pointer;min-height:44px}
.ov{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;overflow-y:auto;background:rgba(20,5,9,.65);padding:16px}
.ov .card{margin-block:auto;width:min(480px,100%);background:var(--card);border-radius:18px;overflow:hidden;border:1px solid rgba(255,183,3,.3)}
.ov .in{padding:20px}
.ov h2{font-family:Lalezar,Cairo,sans-serif;font-weight:400;font-size:44px;line-height:1;margin:0;color:var(--sf);text-shadow:3px 3px 0 var(--red)}
.ov p{font-size:18px}
.btns{display:flex;gap:10px}
.btns button{flex:1;border:0;border-radius:14px;font-family:Lalezar,Cairo,sans-serif;font-size:26px;padding:8px 0 4px;cursor:pointer;color:var(--ink);background:var(--red);box-shadow:0 5px 0 #8f1520}
.btns button.alt{background:var(--tq);color:#062b28;box-shadow:0 5px 0 #11756c}
@media (max-width:720px){
 header{grid-template-columns:minmax(0,1fr)}
 .me{min-width:0}
 }
</style>
</head>
<body>
<div class="truck"></div>
<div class="wrap">
 <header>
  <div><h1>ألعاب جماعية</h1><p class="sub">العب لوحدك أو أونلاين مع صحابك، وكل اللي فاتحين اللعبة بيشوفوا بعض.</p></div>
  <div class="me">
   <label for="pname">اسمك</label><input id="pname" maxlength="14" autocomplete="off" placeholder="اكتب اسمك">
  </div>
 </header>

 <section class="apps" aria-label="الألعاب">
  <a class="app" href="tuktuk.html" id="gTuk"><span class="ico tuk"><img src="assets/icons/tuktuk.png" alt=""></span><b>سباق التوكتوك</b></a>
  <a class="app" href="war.html" id="gWar"><span class="ico war"><img src="assets/icons/sniper.png" alt=""></span><b>حرب شوارع</b></a>
 </section>

 <section class="online">
  <h3 id="onT">أونلاين دلوقتي</h3>
  <ul id="onL"><li class="empty">بنشوف مين أونلاين…</li></ul>
 </section>

 <footer><span id="ver"></span><button id="exitApp" hidden>خروج من اللعبة</button></footer>
</div>

<div class="ov" id="confirm" hidden><div class="card"><div class="truck"></div><div class="in"><h2 id="cfT">خروج</h2><p id="cfQ">هل تريد الخروج؟</p><div class="btns"><button id="cfYes">نعم</button><button class="alt" id="cfNo">لا</button></div></div></div></div>

<script type="module">
import { getLobby, esc, AD, COLORS, myProfile, saveProfile, GAME_NAMES } from './net.js';
document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl';
const $ = (id) => document.getElementById(id);

// ---- profile shared by every game ----
const me = myProfile();
$('pname').value = me.n;
saveProfile(me.n, me.c);
$('pname').oninput = (e) => { me.n = e.target.value.trim().slice(0, 14) || me.n; saveProfile(me.n, null); announce(); };

// ---- who's online ----
let lobby = null;
function announce() { if (lobby) lobby.presence({ pl: { n: me.n, c: me.c, st: 'lobby', game: 'hub', code: null } }).catch(() => {}); }
function renderOnline() {
  if (!lobby) return;
  const ppl = lobby.peers().filter((p) => p.presence && p.presence.pl && typeof p.presence.pl.n === 'string');
  $('onT').textContent = 'أونلاين دلوقتي (' + AD(ppl.length) + ')';
  $('onL').innerHTML = ppl.length ? ppl.map((p) => { const pl = p.presence.pl; const g = GAME_NAMES[pl.game] || GAME_NAMES.tuk; const col = COLORS[Math.max(0, Math.min(COLORS.length - 1, pl.c | 0))][0];
    return `<li><i style="background:${col}"></i>${esc(String(pl.n).slice(0, 14))}${p.sameTab ? ' (إنت)' : ''} <small>${g}</small></li>`; }).join('') : '<li class="empty">مفيش حد تاني دلوقتي.</li>';
}
getLobby().then((l) => {
  if (!l) { $('onL').innerHTML = '<li class="empty">مش متصل بالنت دلوقتي. تقدر تلعب لوحدك عادي.</li>'; return; }
  lobby = l; l.onPeers(renderOnline, () => {}); announce(); setInterval(() => { announce(); renderOnline(); }, 3000);
});

// ---- dialogs, exit, Android back button ----
let cfYes = null;
function askConfirm(t, q, onYes, yes = 'نعم', no = 'لا') { $('cfT').textContent = t; $('cfQ').textContent = q; $('cfYes').textContent = yes; $('cfNo').textContent = no; cfYes = onYes; $('confirm').hidden = false; }
$('cfNo').onclick = () => { $('confirm').hidden = true; };
$('cfYes').onclick = () => { $('confirm').hidden = true; const f = cfYes; if (f) f(); };
const capApp = () => window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
const exitGame = () => { const A = capApp(); if (A && A.exitApp) A.exitApp(); };
const askExit = () => askConfirm('خروج من اللعبة', 'هل تريد الخروج من اللعبة؟', exitGame);
$('exitApp').onclick = askExit;
setTimeout(() => { const A = capApp(); if (A && A.addListener) { $('exitApp').hidden = false; try { A.addListener('backButton', () => { if (!$('confirm').hidden) $('confirm').hidden = true; else askExit(); }); } catch (e) {} } }, 0);

// ---- app updates (APK builds only) ----
const APP_BUILD=0; // the APK build number, filled in by the GitHub build
const REPO = 'adomja1212/Acc';
if (APP_BUILD) $('ver').textContent = 'نسخة ' + AD(APP_BUILD);
// The latest GitHub release is the source of truth for the newest version.
let lastCheck = 0, offered = 0;
async function checkUpdate() {
  if (!APP_BUILD || Date.now() - lastCheck < 30000) return;
  lastCheck = Date.now();
  try {
    const r = await fetch('https://api.github.com/repos/' + REPO + '/releases/latest', { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json(); const m = /^apk-(\d+)$/.exec(j.tag_name || ''); if (!m) return;
    const n = +m[1]; if (n <= APP_BUILD || !$('confirm').hidden) return;
    offered = n;
    const url = 'https://github.com/' + REPO + '/releases/download/' + j.tag_name + '/tuktuk-rally.apk';
    askConfirm('فيه تحديث جديد!', 'نسخة ' + AD(n) + ' من ألعاب جماعية جاهزة (إنت على نسخة ' + AD(APP_BUILD) + '). دوس «حدّث دلوقتي» هيتنزّل الملف، افتحه ودوس «تحديث». لو الموبايل رفض التثبيت، امسح النسخة القديمة الأول وبعدين ثبّت الجديدة.', () => { location.href = url; }, 'حدّث دلوقتي', 'بعدين');
  } catch (e) {}
}
// check on open and every time the app comes back to the front
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
setTimeout(checkUpdate, 1200);
</script>
</body>
</html>
