<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام المحاسب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="locked">
  <div class="auth" id="auth"><div class="auth-boot"><div class="spinner"></div><p>جارٍ الاتصال بقاعدة البيانات…</p></div></div>
  <div class="overlay" id="overlay"></div>

  <!-- القائمة الجانبية -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo" id="brandLetter">م</div>
      <div class="brand-text">
        <div class="brand-name" id="brandName">نظام المحاسب</div>
        <div class="brand-sub">نظام محاسبة متكامل</div>
      </div>
      <button class="pin-btn" id="pinBtn" type="button" title="تثبيت القائمة" aria-label="تثبيت القائمة">
        <svg viewBox="0 0 24 24"><path d="M15 3 21 9l-3 1-4 4 1 5-2 2-4-4-5 5v-1l4-5-4-4 2-2 5 1 4-4z"/></svg>
      </button>
    </div>

    <div class="nav-tabs" role="tablist">
      <button type="button" data-tab="all" class="on">كل القوائم</button>
      <button type="button" data-tab="fav">المفضلة (<span id="favCount">0</span>)</button>
    </div>

    <label class="nav-search">
      <input id="navSearch" type="search" placeholder="ابحث في كل القائمة: حساب، تقرير، مخزن…" aria-label="البحث في القائمة">
      <span class="nav-search-ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
    </label>

    <div class="side-scroll">
      <nav class="nav" id="nav"></nav>

      <div class="admin-tools">
        <button type="button" class="danger-btn" id="clearBoxesBtn">تفريغ خزائن محددة</button>
        <button type="button" class="danger-btn" id="clearMovesBtn">تفريغ الحركات والأرصدة</button>
      </div>

      <div class="version"><span id="versionText"></span> — <button type="button" class="ver-link" id="refreshBtn">تحديث</button></div>
    </div>

    <div class="sidebar-footer">
      <button type="button" class="user-btn" id="userBtn" aria-haspopup="menu" title="حسابي">
        <span class="avatar" id="userAvatar">م</span>
        <span class="user-info">
          <span class="user-name" id="userName">مستخدم</span>
          <span class="user-role" id="userRole">—</span>
        </span>
      </button>
      <div class="user-menu" id="userMenu" role="menu" hidden>
        <button type="button" data-um="pass" role="menuitem">🔑 تغيير كلمة المرور</button>
        <button type="button" data-um="users" id="umUsers" role="menuitem">👥 المستخدمون والصلاحيات</button>
        <button type="button" data-um="logout" class="um-out" role="menuitem">⎋ تسجيل الخروج</button>
      </div>
      <i class="online" id="onlineDot"></i>
      <button type="button" class="lang" id="langBtn" title="لغة الواجهة">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <span>العربية</span><b>AR</b>
      </button>
    </div>
  </aside>

  <!-- المحتوى -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="القائمة">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="title-block">
        <h1 id="pageTitle">لوحة المعلومات</h1>
        <div class="crumbs" id="pageSub">جارٍ التحميل…</div>
      </div>
      <div class="topbar-actions">
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="globalSearch" type="search" placeholder="بحث في كل السجلات...">
        </div>
        <div class="sync" id="syncPill"><i></i><span>جارٍ الاتصال…</span></div>
      </div>
    </header>

    <div class="ro-banner" id="roBanner" hidden>وضع المشاهدة فقط — لا يمكنك إضافة أو تعديل البيانات. اطلب من مالك النظام صلاحية "مساهم" أو "محرر".</div>
    <section class="content" id="content"></section>
  </main>

  <!-- نافذة الإضافة/التعديل -->
  <div class="modal" id="modal" aria-hidden="true">
    <form class="modal-box" id="modalForm">
      <div class="modal-head">
        <h3 id="modalTitle">إضافة سجل</h3>
        <button type="button" class="icon-btn" data-close aria-label="إغلاق">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot">
        <button type="button" class="btn ghost" data-close>إغلاق</button>
        <button type="submit" class="btn primary" id="saveBtn">حفظ</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
