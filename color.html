<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>تلوين</title>

<style>
:root{--bg:#fff5e6;--ink:#3b2a1a;--card:#fff;--acc:#ff7a59;--acc2:#4cc2b0;--sel:#ff7a59}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 Cairo,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{background:radial-gradient(circle at 15% 10%,#ffe0c2 0,transparent 35%),radial-gradient(circle at 90% 90%,#d9f3ee 0,transparent 40%),var(--bg)}
button{font-family:inherit;cursor:pointer}
/* gallery */
#gal{min-height:100%;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:1100px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{background:none;border:0;color:#a0522d;text-decoration:underline;font:700 15px Cairo;min-height:44px}
h1{font:400 54px/1 Lalezar,Cairo,sans-serif;margin:6px 0 4px;background:linear-gradient(90deg,#ff5e5e,#ffb02e,#3cc37a,#3a8dff,#b05cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 0 14px;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.tile{border:0;background:var(--card);border-radius:22px;padding:10px 10px 8px;box-shadow:0 6px 0 #f0d9bd,0 10px 20px rgba(160,82,45,.12);display:grid;gap:6px;justify-items:center;transition:transform .12s}
.tile:active{transform:scale(.96)}
.tile img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:14px;background:#fff}
.tile b{font-size:17px}
.tile.blank img{background:repeating-linear-gradient(45deg,#fff 0 12px,#fff7ee 12px 24px)}
.round{width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 0 #f0d9bd;font-size:22px}
/* drawing screen */
#draw{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:calc(8px + env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:8px}
#bar{display:flex;align-items:center;gap:8px}
#bar .t{flex:1;font:400 28px Lalezar,Cairo;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{position:relative;display:grid;place-items:center;min-height:0}
#paper{position:relative;width:var(--P);height:var(--P);border-radius:22px;background:#fff;box-shadow:0 8px 0 #f0d9bd,0 16px 30px rgba(160,82,45,.18);overflow:hidden;touch-action:none}
#paper canvas{position:absolute;inset:0;width:100%;height:100%}
#lines{pointer-events:none}
#tools{display:grid;gap:8px}
.trow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.tool{height:52px;min-width:52px;padding:0 12px;border-radius:16px;border:3px solid transparent;background:#fff;box-shadow:0 4px 0 #f0d9bd;font:800 15px Cairo;display:flex;align-items:center;gap:6px}
.tool span{font-size:24px}
.tool[aria-pressed=true]{border-color:var(--sel);background:#fff0ea}
.size{width:52px;height:52px;border-radius:16px;border:3px solid transparent;background:#fff;box-shadow:0 4px 0 #f0d9bd;display:grid;place-items:center}
.size i{display:block;border-radius:50%;background:var(--cur,#333)}
.size[aria-pressed=true]{border-color:var(--sel)}
#pal{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;max-width:760px;margin:0 auto;width:100%}
#pal button{aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.12);background:var(--c)}
#pal button[aria-pressed=true]{transform:scale(1.18);border-color:#3b2a1a;box-shadow:0 0 0 3px #fff,0 4px 8px rgba(0,0,0,.25)}
#pal .rb{background:conic-gradient(#ff5e5e,#ffb02e,#ffe14d,#3cc37a,#3a8dff,#b05cff,#ff5e5e)}
#cur{width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px #3b2a1a;background:var(--cur,#ff5e5e);flex:none}
.ok{position:fixed;inset:auto 0 30%;text-align:center;font:400 44px Lalezar;color:#ff7a59;text-shadow:2px 2px 0 #fff;pointer-events:none;animation:yay 1.4s forwards}
@keyframes yay{0%{transform:scale(.3);opacity:0}20%{transform:scale(1.15);opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
@media (orientation:landscape) and (max-height:600px){
 #draw{grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr) minmax(0,330px)}
 #bar{grid-column:1/3}
 #tools{align-content:center}
 #pal{grid-template-columns:repeat(6,minmax(0,1fr))}
}
</style>

<section id="gal">
 <div class="top"><button class="back" id="toHub">→ رجوع لقايمة الألعاب</button><button class="round" id="bMus" aria-label="الموسيقى">🎵</button></div>

 </div>
</section>

const PICS=[
 {id:'duck',name:'بطة',svg:S(`<path d="M20 330 Q60 310 100 330 T180 330 T260 330 T340 330 T390 330 L390 390 L20 390 Z"/><ellipse cx="210" cy="265" rx="120" ry="62"/><path d="M300 240 Q350 220 340 260 Q330 290 300 285"/><circle cx="135" cy="160" r="62"/><path d="M75 165 Q30 160 22 180 Q40 200 82 188 Z"/><circle cx="125" cy="145" r="11"/><path d="M170 250 Q215 225 265 250 Q230 290 170 250 Z"/>`)},

 {id:'sun',name:'شمس',svg:S(`<circle cx="200" cy="200" r="95"/><circle cx="165" cy="180" r="12"/><circle cx="235" cy="180" r="12"/><path d="M155 225 Q200 265 245 225"/><circle cx="145" cy="218" r="12"/><circle cx="255" cy="218" r="12"/>${Array.from({length:12},(_,i)=>{ const a=i*Math.PI/6, c=Math.cos(a), s=Math.sin(a), b=(r)=>[200+c*r,200+s*r], w=0.16; const p1=[200+Math.cos(a-w)*110,200+Math.sin(a-w)*110], p2=[200+Math.cos(a+w)*110,200+Math.sin(a+w)*110], t=b(175); return `<path d="M${p1[0].toFixed(1)} ${p1[1].toFixed(1)} L${t[0].toFixed(1)} ${t[1].toFixed(1)} L${p2[0].toFixed(1)} ${p2[1].toFixed(1)} Z"/>`; }).join('')}`)},
 {id:'car',name:'عربية',svg:S(`<path d="M10 330 L390 330 L390 392 L10 392 Z"/><path d="M40 290 L40 240 Q45 215 80 210 L120 205 L160 145 Q170 132 190 132 L270 132 Q290 132 300 148 L335 205 Q370 212 370 245 L370 290 Z"/><path d="M175 150 L180 205 L130 205 L165 155 Q168 150 175 150 Z"/><path d="M200 150 L265 150 Q278 150 285 160 L310 205 L205 205 Z"/><circle cx="115" cy="295" r="38"/><circle cx="115" cy="295" r="16"/><circle cx="295" cy="295" r="38"/><circle cx="295" cy="295" r="16"/><path d="M345 232 L368 232 L368 255 L345 255 Z"/><path d="M42 240 L62 240 L62 262 L42 262 Z"/>`)},
 {id:'fish',name:'سمكة',svg:S(`<path d="M10 360 Q100 340 200 360 T390 360 L390 392 L10 392 Z"/><path d="M60 200 Q150 95 270 200 Q150 305 60 200 Z"/><path d="M265 200 L350 140 L335 200 L350 260 Z"/><path d="M150 140 Q175 95 215 125 Q185 145 150 140 Z"/><path d="M150 262 Q175 305 215 275 Q185 255 150 262 Z"/><circle cx="105" cy="185" r="13"/><path d="M150 155 Q175 200 150 245"/><path d="M195 150 Q220 200 195 250"/><circle cx="60" cy="110" r="14"/><circle cx="40" cy="70" r="10"/><circle cx="70" cy="40" r="8"/>`)},
 {id:'butterfly',name:'فراشة',svg:S(`<path d="M195 180 Q120 60 55 100 Q20 140 70 185 Q130 205 195 190 Z"/><path d="M205 180 Q280 60 345 100 Q380 140 330 185 Q270 205 205 190 Z"/><path d="M195 205 Q120 215 85 270 Q95 320 150 300 Q190 270 195 215 Z"/><path d="M205 205 Q280 215 315 270 Q305 320 250 300 Q210 270 205 215 Z"/><ellipse cx="200" cy="200" rx="16" ry="90"/><path d="M193 115 Q170 60 150 50"/><path d="M207 115 Q230 60 250 50"/><circle cx="110" cy="140" r="20"/><circle cx="290" cy="140" r="20"/><circle cx="135" cy="265" r="15"/><circle cx="265" cy="265" r="15"/>`)},

 {id:'apple',name:'تفاحة',svg:S(`<path d="M200 120 Q130 70 85 130 Q40 210 95 300 Q140 370 200 330 Q260 370 305 300 Q360 210 315 130 Q270 70 200 120 Z"/><path d="M200 120 Q195 85 210 55"/><path d="M210 80 Q250 40 295 65 Q260 105 210 80 Z"/><path d="M110 170 Q105 210 125 245"/>`)},
 {id:'bird',name:'عصفورة',svg:S(`<path d="M20 320 L380 300 L380 322 L20 342 Z"/><path d="M110 300 Q120 330 100 350 M290 290 Q300 320 285 345"/><ellipse cx="200" cy="220" rx="95" ry="70"/><circle cx="270" cy="160" r="48"/><path d="M312 150 L365 165 L312 178 Z"/><circle cx="280" cy="148" r="9"/><path d="M150 205 Q200 170 240 215 Q200 260 150 205 Z"/><path d="M108 210 L45 175 L60 230 L40 260 L112 240 Z"/><path d="M185 288 L180 300 M220 288 L225 300"/>`)},

 {id:'tuk',name:'توكتوك',svg:S(`<path d="M10 350 L390 350 L390 392 L10 392 Z"/><path d="M95 120 L330 120 Q345 120 345 135 L345 145 L80 145 L80 135 Q80 120 95 120 Z"/><path d="M100 145 L100 290 M320 145 L320 290"/><path d="M60 295 Q55 230 110 225 L215 225 L215 145 L245 145 L250 220 L330 225 Q355 230 355 260 L355 300 L60 300 Z"/><path d="M110 225 Q100 175 140 160 L205 160 L205 225 Z"/><circle cx="115" cy="310" r="34"/><circle cx="115" cy="310" r="12"/><circle cx="300" cy="310" r="34"/><circle cx="300" cy="310" r="12"/><circle cx="70" cy="255" r="16"/>`)},
];
const BLANK={id:'blank',name:'ورقة فاضية',svg:S('')};
const svgURL=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
// thumbnails show your colouring so far
function thumb(p){ try{ const d=localStorage.getItem('col-'+p.id); if(d) return d; }catch(e){} return svgURL(p.svg); }
function renderGallery(){ $('tiles').innerHTML=[BLANK,...PICS].map(p=>`<button class="tile ${p===BLANK?'blank':''}" data-id="${p.id}"><img alt="" src="${thumb(p)}"><b>${p===BLANK?'✏️ ':''}${p.name}</b></button>`).join(''); }
$('tiles').onclick=e=>{ const b=e.target.closest('.tile'); if(!b) return; openPic([BLANK,...PICS].find(p=>p.id===b.dataset.id)); };
$('toHub').onclick=()=>{ location.href='index.html'; };

// ================= painting =================
const N=1000, paint=$('paint'), lines=$('lines'), pg=paint.getContext('2d',{willReadFrequently:true}), lg=lines.getContext('2d',{willReadFrequently:true});
paint.width=paint.height=lines.width=lines.height=N;
let CUR=null, TOOL='fill', COLOR='#ff5e5e', SIZE=18, UNDO=[], wall=null;
const COLORS=['#ff5e5e','#ff8a3d','#ffb02e','#ffe14d','#b8e04a','#3cc37a','#1fa37a','#4cc2e0','#3a8dff','#3557d6','#8a5cff','#d05cff','#ff7ab8','#ff4d8d','#c2185b','#8b5a2b','#c69c6d','#f5d6b8','#ffffff','#bdbdbd','#757575','#3b3b3b','#000000','rainbow'];
$('pal').innerHTML=COLORS.map(c=>c==='rainbow'?`<button class="rb" data-c="rainbow" aria-label="ألوان عشوائية"></button>`:`<button style="--c:${c}" data-c="${c}" aria-label="${c}"></button>`).join('');
function setColor(c){ COLOR=c; document.querySelectorAll('#pal button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===c)); const shown=c==='rainbow'?'conic-gradient(#ff5e5e,#ffb02e,#3cc37a,#3a8dff,#b05cff,#ff5e5e)':c; $('cur').style.background=shown; document.querySelectorAll('.size i').forEach(i=>i.style.background=c==='rainbow'?'#ff5e5e':c); if(TOOL==='erase') setTool('fill'); }
$('pal').onclick=e=>{ const b=e.target.closest('button[data-c]'); if(b){ setColor(b.dataset.c); pop(700,0.05); } };
function setTool(t){ TOOL=t; document.querySelectorAll('.tool').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t)); $('sizes').style.visibility=t==='fill'?'hidden':'visible'; }
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
$('sizes').onclick=e=>{ const b=e.target.closest('.size'); if(!b) return; SIZE=+b.dataset.s; document.querySelectorAll('.size').forEach(x=>x.setAttribute('aria-pressed',x===b)); };
const RB=['#ff5e5e','#ff8a3d','#ffe14d','#3cc37a','#3a8dff','#8a5cff','#ff7ab8'];
const pickColor=()=>COLOR==='rainbow'?RB[Math.floor(Math.random()*RB.length)]:COLOR;
function hex2rgb(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function layout(){ const st=$('stage'); const s=Math.max(200,Math.min(st.clientWidth,st.clientHeight)-6); document.documentElement.style.setProperty('--P',s+'px'); }
addEventListener('resize',()=>{ if(!$('draw').hidden) layout(); });
async function openPic(p){ CUR=p; UNDO=[]; $('gal').hidden=true; $('draw').hidden=false; $('title').textContent=p.name; layout(); initAudio();
 pg.fillStyle='#fff'; pg.fillRect(0,0,N,N); lg.clearRect(0,0,N,N);
 await new Promise(res=>{ const img=new Image(); img.onload=()=>{ lg.drawImage(img,0,0,N,N); res(); }; img.onerror=res; img.src=svgURL(p.svg); });
 // walls for the bucket: anything dark on the line layer
 const ld=lg.getImageData(0,0,N,N).data; wall=new Uint8Array(N*N); for(let i=0;i<N*N;i++) wall[i]=ld[i*4+3]>90?1:0;
 try{ const saved=localStorage.getItem('col-'+p.id); if(saved){ await new Promise(res=>{ const im=new Image(); im.onload=()=>{ pg.drawImage(im,0,0,N,N); res(); }; im.onerror=res; im.src=saved; }); redrawLinesOnly(); } }catch(e){} }
function redrawLinesOnly(){ /* the saved image includes the outlines; paint the outline pixels back to white underneath so only fills stay on the paint layer */ const d=pg.getImageData(0,0,N,N); for(let i=0;i<N*N;i++) if(wall[i]){ d.data[i*4]=255; d.data[i*4+1]=255; d.data[i*4+2]=255; } pg.putImageData(d,0,0); }
function pushUndo(){ UNDO.push(pg.getImageData(0,0,N,N)); if(UNDO.length>12) UNDO.shift(); }
$('bUndo').onclick=()=>{ const u=UNDO.pop(); if(u){ pg.putImageData(u,0,0); save(); pop(400,0.05); } };
$('bClear').onclick=()=>{ pushUndo(); pg.fillStyle='#fff'; pg.fillRect(0,0,N,N); save(); };
$('bBack').onclick=()=>{ save(); $('draw').hidden=true; $('gal').hidden=false; renderGallery(); };
function composite(){ const c=document.createElement('canvas'); c.width=c.height=N; const g=c.getContext('2d'); g.drawImage(paint,0,0); g.drawImage(lines,0,0); return c; }
let saveT=null; function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ const s=document.createElement('canvas'); s.width=s.height=500; s.getContext('2d').drawImage(composite(),0,0,500,500); localStorage.setItem('col-'+CUR.id,s.toDataURL('image/jpeg',0.85)); }catch(e){} },300); }
$('bSave').onclick=async()=>{ const c=composite(); const url=c.toDataURL('image/png'); try{ const blob=await (await fetch(url)).blob(); const file=new File([blob],'my-drawing.png',{type:'image/png'}); if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'رسمتي'}); return; } }catch(e){} const a=document.createElement('a'); a.href=url; a.download='my-drawing.png'; a.click(); yay('اتحفظت! 🎉'); };
function yay(t){ const d=document.createElement('div'); d.className='ok'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1500); }
// bucket fill: spread from the tap inside the outlines, then grow 3px under the lines so no white edges show
function fill(x,y){ x|=0; y|=0; if(x<0||y<0||x>=N||y>=N) return; if(wall[y*N+x]){ // tapped a line: look for the nearest open pixel
  let found=false; for(let r=1;r<10&&!found;r++) for(const [dx,dy] of [[r,0],[-r,0],[0,r],[0,-r]]){ const xx=x+dx, yy=y+dy; if(xx>=0&&yy>=0&&xx<N&&yy<N&&!wall[yy*N+xx]){ x=xx; y=yy; found=true; break; } } if(!found) return; }
 pushUndo(); const img=pg.getImageData(0,0,N,N), d=img.data, i0=(y*N+x)*4, sr=d[i0], sgc=d[i0+1], sb=d[i0+2]; const [r,gg,b]=hex2rgb(pickColor());
 if(Math.abs(sr-r)+Math.abs(sgc-gg)+Math.abs(sb-b)<6){ UNDO.pop(); return; }
 const same=i=>{ const k=i*4; return !wall[i]&&Math.abs(d[k]-sr)+Math.abs(d[k+1]-sgc)+Math.abs(d[k+2]-sb)<60; };
 const mark=new Uint8Array(N*N), st=[y*N+x]; mark[y*N+x]=1; const reg=[];
 while(st.length){ const i=st.pop(); reg.push(i); const px=i%N; if(px>0&&!mark[i-1]&&same(i-1)){ mark[i-1]=1; st.push(i-1); } if(px<N-1&&!mark[i+1]&&same(i+1)){ mark[i+1]=1; st.push(i+1); } if(i>=N&&!mark[i-N]&&same(i-N)){ mark[i-N]=1; st.push(i-N); } if(i<N*N-N&&!mark[i+N]&&same(i+N)){ mark[i+N]=1; st.push(i+N); } }
 let edge=reg; for(let it=0;it<3;it++){ const next=[]; for(const i of edge){ const px=i%N; for(const j of [px>0?i-1:-1,px<N-1?i+1:-1,i-N,i+N]){ if(j<0||j>=N*N||mark[j]||!wall[j]) continue; mark[j]=1; next.push(j); } } reg.push(...next); edge=next; }
 for(const i of reg){ const k=i*4; d[k]=r; d[k+1]=gg; d[k+2]=b; d[k+3]=255; } pg.putImageData(img,0,0); save(); pop(520+Math.random()*200,0.09); }
// brush and eraser, drawn under the outlines
let drawing=null;
function pt(e){ const r=paint.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*N,(e.clientY-r.top)/r.height*N]; }
$('paper').addEventListener('pointerdown',e=>{ e.preventDefault(); initAudio(); const [x,y]=pt(e); if(TOOL==='fill'){ fill(x,y); return; } pushUndo(); $('paper').setPointerCapture(e.pointerId); drawing={id:e.pointerId,x,y,c:TOOL==='erase'?'#ffffff':pickColor()}; stroke(x,y,x+0.01,y); });
$('paper').addEventListener('pointermove',e=>{ if(!drawing||e.pointerId!==drawing.id) return; const [x,y]=pt(e); stroke(drawing.x,drawing.y,x,y); drawing.x=x; drawing.y=y; });
const endStroke=e=>{ if(drawing&&e.pointerId===drawing.id){ drawing=null; save(); } };
$('paper').addEventListener('pointerup',endStroke); $('paper').addEventListener('pointercancel',endStroke);
function stroke(x0,y0,x1,y1){ pg.strokeStyle=drawing.c; pg.lineWidth=SIZE*(N/600); pg.lineCap='round'; pg.lineJoin='round'; pg.beginPath(); pg.moveTo(x0,y0); pg.lineTo(x1,y1); pg.stroke(); }

// ================= calm music and soft sounds =================
const AU={on:true,ctx:null}; try{ AU.on=localStorage.getItem('col-mus')!=='0'; }catch(e){}
function initAudio(){ if(AU.ctx){ AU.ctx.resume(); return; } try{ const C=new (window.AudioContext||window.webkitAudioContext)(); AU.ctx=C; AU.fx=C.createGain(); AU.fx.gain.value=0.5; AU.fx.connect(C.destination); const m=C.createGain(); m.gain.value=0.8; m.connect(C.destination); AU.bgm=createBGM(C,m,'calm'); if(AU.on) AU.bgm.start(); }catch(e){ AU.ctx=null; } }
addEventListener('pointerdown',()=>initAudio(),{once:true,capture:true});
function pop(f,v){ if(!AU.ctx) return; const C=AU.ctx,o=C.createOscillator(),g=C.createGain(),t=C.currentTime; o.type='sine'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*1.6,t+0.08); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18); o.connect(g); g.connect(AU.fx); o.start(t); o.stop(t+0.2); }
function musBtn(){ $('bMus').textContent=AU.on?'🎵':'🔇'; }
$('bMus').onclick=()=>{ initAudio(); AU.on=!AU.on; try{ localStorage.setItem('col-mus',AU.on?'1':'0'); }catch(e){} if(AU.bgm){ if(AU.on) AU.bgm.start(); else AU.bgm.stop(); } musBtn(); };
musBtn(); setColor('#ff5e5e'); setTool('fill'); renderGallery();
</script>
