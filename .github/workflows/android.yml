name: Android APK

on:
  push:
    branches: [ccr-7b1fff8c-9wqli9, main]
    paths:
      - index.html
      - android-res/**
      - tools/**
      - package.json
      - capacitor.config.json
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Bundle the game for offline play
        run: node tools/build-www.mjs

      - name: Create the Android project
        run: npx cap add android

      - name: App icon and keep-awake screen
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp android-res/icons/$d.png $RES/mipmap-$d/$n.png
            done
          done
          cp android-res/MainActivity.java android/app/src/main/java/eg/tuktuk/rally/MainActivity.java

      - name: Use Google's Maven Central mirror first (Maven Central rate-limits CI)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/mirror.gradle <<'GRADLE'
          def mirror = { repos ->
            repos.maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
          }
          settingsEvaluated { s ->
            s.pluginManagement.repositories { mirror(delegate) }
          }
          allprojects {
            buildscript { repositories { mirror(delegate) } }
            repositories { mirror(delegate) }
          }
          GRADLE

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon && break
            if [ $i = 3 ]; then exit 1; fi
            echo "Build failed, retrying in 60s ($i/3)"; sleep 60
          done
          cp app/build/outputs/apk/debug/app-debug.apk ../tuktuk-rally.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tuktuk-rally-apk
          path: tuktuk-rally.apk

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: توكتوك رالي للأندرويد (نسخة ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: tuktuk-rally.apk
          body: |
            نزّل ملف tuktuk-rally.apk على الموبايل وافتحه.
            لو الموبايل سأل، اسمح بتثبيت التطبيقات من المصدر ده.
            اللعب لوحدك شغال من غير نت، والسباق أونلاين محتاج نت.
